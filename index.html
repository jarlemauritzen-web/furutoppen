<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Furutoppen">
<meta name="theme-color" content="#0a0d13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Furutoppen</title>
<style>
/* VOICE: a calm wall controller; few words, the room and its number are the hero
   IDEA: a brushed-metal rotary dial — turn the outer wheel, the room under the pointer is active
   PICTURE: home = the room wheel; room = one big knob with heat, dimming and a colour wheel inside
   COLOUR and TYPE: night graphite, amber heat, gold light, blue for cold; system rounded type
   LAYOUT: one column up to 560px, everything centred on the dial */
:root{--f:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;--bg:#0a0d13;--panel:#141a24;--line:#252e3c;--ink:#eef1f6;--mut:#8b94a5;--warm:#f08a35;--gold:#f5c542;--man:#ffb54a;color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(900px 600px at 50% -10%,#1b2434 0,var(--bg) 65%),var(--bg);color:var(--ink);font:16px/1.45 var(--f);overflow-x:clip}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;padding:16px 16px 22px;position:relative}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:30px;line-height:1.1;margin:0;font-weight:900}
.date{color:var(--mut);font-weight:700}
.icbtn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 2px}
.pb{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:800;white-space:nowrap}
.pb span{color:var(--mut)}
.wheel{display:block;width:100%;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;outline:none;margin:4px 0}
.wheel:active{cursor:grabbing}
.wheel text{font-family:var(--f);fill:var(--ink)}
.wheel:focus-visible{outline:3px solid #9cc0ff;outline-offset:-6px;border-radius:50%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px 16px;display:flex;gap:14px;align-items:center;margin-top:10px}
.card b{display:block;font-size:17px}.card span{color:var(--mut);font-size:15px}
.card .ic{flex:none;width:44px;height:44px;border-radius:14px;background:#1d2533;display:grid;place-items:center;color:#9cb4e8}
.card.alert .ic{background:#3a2412;color:var(--warm)}
.wide{width:100%;margin-top:10px;display:flex;justify-content:center;align-items:center;gap:10px;font:800 17px var(--f);background:#1b2331;border:1px solid var(--line);color:var(--ink);border-radius:22px;min-height:58px;cursor:pointer}
.wide span{color:var(--mut);font-weight:700;font-size:15px}
.wide:disabled{opacity:.5;cursor:default}
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.mode{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:18px;background:var(--panel);border:1px solid transparent;color:var(--mut);font-weight:800;font-size:14px}
.mode.on{color:var(--ink);border-color:#5a6a85;background:#1c2536}
.menu{position:absolute;right:16px;top:70px;z-index:5;background:#182030;border:1px solid var(--line);border-radius:18px;padding:6px;display:flex;flex-direction:column;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.menu button{font:800 16px var(--f);color:var(--ink);background:none;border:0;text-align:left;padding:12px 16px;border-radius:12px;cursor:pointer;min-width:180px}
.menu button:hover{background:#222c3e}
/* room */
.rhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.rhead h2{margin:0;font-size:26px;font-weight:900;line-height:1.1}
.rhead .date{font-size:15px}
.knob{position:relative;width:100%;max-width:420px;aspect-ratio:1;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.knob>svg{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
#disk{position:absolute;left:12.667%;top:12.667%;width:74.667%;height:74.667%;border-radius:50%;overflow:hidden;box-shadow:inset 0 0 34px rgba(0,0,0,.45)}
#disk.pick{cursor:crosshair}
.kc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;gap:2px;padding:12%}
.kc .nm{font-weight:800;font-size:18px;color:#fff3e6}
.big{font-weight:900;font-size:clamp(56px,17vw,88px);line-height:1;letter-spacing:-.02em;color:#fff;white-space:nowrap}
.big small{font-size:.4em;vertical-align:.95em;margin-left:2px}
.now{color:#fff0e0;font-weight:700;font-size:15px;white-space:nowrap}
.pill{margin-top:8px;font-size:13px;font-weight:800;padding:5px 12px;border-radius:999px;background:rgba(0,0,0,.3);color:#fff0e0;white-space:nowrap}
.pill.man{color:var(--man)}
.mk{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.55);pointer-events:none}
.cw{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);display:flex;background:rgba(20,24,32,.78);border-radius:999px;padding:3px;pointer-events:auto}
.cw button{border:0;background:none;color:#cfd5de;font:800 13px var(--f);padding:7px 13px;border-radius:999px;cursor:pointer}
.cw button[aria-pressed=true]{background:#fff;color:#111}
.kval{text-align:center;font-weight:800;font-size:17px;color:var(--gold);margin:8px 0 0;min-height:24px}
.lamps{display:flex;gap:8px;overflow-x:auto;padding:8px 2px;scrollbar-width:none}
.lamps::-webkit-scrollbar{display:none}
.lamp{flex:none;display:flex;align-items:center;gap:8px;padding:9px 14px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 14px var(--f);cursor:pointer;white-space:nowrap}
.lamp i{width:9px;height:9px;border-radius:50%;background:#3a4354}
.lamp i.on{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.lamp[aria-pressed=true]{border-color:var(--gold);background:#2a2412}
.under{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px 0 4px}
.power{width:76px;height:76px;border-radius:50%;border:0;background:#fff;color:var(--warm);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.power.off{background:#1c2331;color:#aab2c0;border:1px solid var(--line)}
.plabel{font-weight:800;color:var(--mut);font-size:14px}
.btn{font:800 15px var(--f);border-radius:999px;padding:11px 20px;min-height:44px;cursor:pointer;border:1px solid var(--man);background:var(--man);color:#2a1700}
.btn:disabled{opacity:.35;cursor:default}
ul.devs{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--line);width:100%}
.devs li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
.devs .n{font-weight:700}.devs .s{color:var(--mut);font-size:14px}
.devs .v{font-weight:800;white-space:nowrap}
.tag{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:#202938;color:var(--mut);white-space:nowrap}
.tag.h{background:rgba(240,138,53,.18);color:var(--warm)}.tag.m{background:rgba(255,181,74,.18);color:var(--man)}
.tabs{display:flex;justify-content:center;gap:4px;margin-top:16px}
.tab{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--mut);font:800 14px var(--f);cursor:pointer}
.tab .b{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff}
.tab{flex:0 1 74px;font-size:13px;white-space:nowrap}
.t-light .b{background:radial-gradient(circle at 40% 35%,#ffd86a,#c98f14)}
.t-heat .b{background:radial-gradient(circle at 40% 35%,#ff9a52,#b8481a)}
.t-mood .b{background:radial-gradient(circle at 40% 35%,#c99bff,#7a3fd0)}
.t-music .b{background:radial-gradient(circle at 40% 35%,#8f9bff,#3d3fb8)}
.t-shade .b{background:radial-gradient(circle at 40% 35%,#8fd0ff,#2c6fae)}
.tab[aria-pressed=true]{color:var(--ink)}
.tab[aria-pressed=true] .b{box-shadow:0 0 0 3px var(--bg),0 0 0 5px #fff}
.tab:disabled{opacity:.25;cursor:default}
button:focus-visible{outline:3px solid #9cc0ff;outline-offset:2px}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#202938;border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;z-index:9}
.toast.show{opacity:1}.toast.err{color:#ff8a7a}
.src{color:var(--mut);font-size:13px;text-align:center;margin-top:12px}
.mg{position:absolute;inset:13% 9%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 4px;align-content:center;justify-items:center}
.mb{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;color:#fff;font:800 12px var(--f);cursor:pointer;width:100%;padding:0}
.mb .o{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:rgba(30,20,10,.8);box-shadow:0 4px 12px rgba(0,0,0,.4);transition:transform .15s}
.mb:active .o{transform:scale(.92)}
.mb .t{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.mctl{display:flex;align-items:center;justify-content:center;gap:22px}
.rb{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;cursor:pointer;font:800 12px var(--f)}
.rb.big{width:78px;height:78px;background:#fff;color:#3d3fb8;border:0;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.rbl{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:13px;color:var(--mut)}
.shadeov{position:absolute;left:0;right:0;top:0;background:repeating-linear-gradient(#ece6d9 0 8px,#d3cabb 8px 10px);box-shadow:0 3px 10px rgba(0,0,0,.45);transition:height .2s}
.kc.sh{text-shadow:0 1px 6px rgba(0,0,0,.7)}
.trk{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800;color:#fff;font-size:15px;margin-top:6px}
.hint{color:var(--mut);font-size:14px;text-align:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <section id="home">
    <div class="top">
      <div><h1 id="greet">God kveld</h1><div class="date" id="date"></div></div>
      <button class="icbtn" id="scopeBtn" aria-label="Hele huset eller etasje" aria-expanded="false"></button>
    </div>
    <div class="menu" id="menu" hidden>
      <button data-s="house">Hele huset</button>
      <button data-s="f2">2. etasje</button>
      <button data-s="f1">1. etasje</button>
    </div>
    <div class="pills"><div class="pb" id="wx"></div><div class="pb" id="pw"></div></div>
    <svg class="wheel" id="wheel" viewBox="0 0 400 400" tabindex="0" role="slider" aria-label="Velg rom: dra rundt hjulet, Enter åpner"></svg>
    <div id="cards"></div>
    <button class="wide" id="allOff"></button>
    <div class="modes" id="modes"></div>
    <p class="src" id="src"></p>
  </section>

  <section id="room" hidden>
    <div class="rhead">
      <button class="icbtn" id="back" aria-label="Tilbake til hjulet"></button>
      <div><h2 id="rName"></h2><div class="date" id="rSub"></div></div>
    </div>
    <div class="knob" id="knob">
      <svg id="ring" viewBox="0 0 300 300" aria-hidden="true"></svg>
      <div id="disk"></div>
      <div class="kc" id="kc"></div>
    </div>
    <div class="kval" id="kval"></div>
    <div class="lamps" id="lamps"></div>
    <div class="under" id="under"></div>
    <div class="tabs" id="tabs"></div>
  </section>
  <div class="toast" id="toast" role="status"></div>
</div>
<script>
{
const ICON={
  sofa:'M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3M3 11a2 2 0 0 1 2 2v2h14v-2a2 2 0 1 1 4 0v4H1v-4a2 2 0 0 1 2-2zM5 17v2M19 17v2',
  bath:'M3 12h18v3a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4zM5 12V6a2 2 0 0 1 4 0M7 19l-1 2M17 19l1 2',
  hall:'M5 21V3h14v18M9 21V9h6v12M3 21h18',
  door:'M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M4 21h16M14.5 12h.01',
  wash:'M5 3h14v18H5zM5 7h14M8 5h.01M12 10a4 4 0 1 0 0 8a4 4 0 1 0 0-8',
  desk:'M3 4h18v12H3zM8 20h8M12 16v4',
  tv:'M3 7h18v12H3zM8 3l4 4 4-4',
  bed:'M3 19V6M3 14h18v5M21 19v-5M6 14v-2a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v2',
  bedk:'M3 19V8M3 14h18v5M21 19v-5M6 14v-2a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v2M17 4l.8 1.7 1.8.3-1.3 1.2.3 1.8-1.6-.9-1.6.9.3-1.8L15.4 6l1.8-.3z',
  umb:'M3 12a9 9 0 0 1 18 0zM12 12v7a2 2 0 0 1-4 0',
  balc:'M3 21h18M5 21v-7h14v7M9.5 14v7M14.5 14v7M4 14h16M8 3h8v7H8z',
  car:'M3 9l9-5 9 5M6 19v-4l1.5-4h9l1.5 4v4zM6 15h12M8 19v1.5M16 19v1.5',
  bulb:'M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.4 1 2.5h6c0-1.1.4-1.9 1-2.5A6 6 0 0 0 12 3z',
  flame:'M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z',
  power:'M12 3v9M6.3 7a8 8 0 1 0 11.4 0',
  window:'M4 4h16v16H4zM12 4v16M4 12h16',
  cloud:'M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 9a4.5 4.5 0 0 0 1 9z',
  bolt:'M13 2L4 14h7l-1 8 9-12h-7z',
  home:'M3 11l9-7 9 7M5 10v10h14V10',
  moon:'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z',
  users:'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21a7 7 0 0 1 14 0M16 3.5a4 4 0 0 1 0 7.5M22 21a7 7 0 0 0-4-6.3',
  bag:'M4 7h16v13H4zM9 7V4h6v3M4 12h16',
  back:'M15 5l-7 7 7 7',
  spark:'M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8z',
  note:'M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM20 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z',
  blind:'M3 3h18M5 3v11h14V3M5 6.5h14M5 10h14M12 14v4M12 18a1.5 1.5 0 1 0 0 3',
  play:'M8 5v14l11-7z',pause:'M7 5h3.5v14H7zM13.5 5H17v14h-3.5z',next:'M5 5l9 7-9 7zM17 5v14',prev:'M19 5l-9 7 9 7zM7 5v14',
  up:'M6 15l6-6 6 6',down:'M6 9l6 6 6-6',stop:'M7 7h10v10H7z',
  sliders:'M4 7h10M18 7h2M4 17h4M12 17h8M16 5v4M10 15v4'
};
const ROOMS=[
 {k:'stue',n:'Stue & kjøkken',s:'Stue',f:2,ic:'sofa',zone:'Stue & Kjøkken',sensor:'Klima stue og kjøkken',dev:[['Varmepumpe 2. etg','vp','K3_Man_VP2'],['Termostat Stue','gulv','K3_Man_Stue']]},
 {k:'veranda',out:1,n:'Veranda',s:'Veranda',f:2,ic:'balc',zone:'Veranda',sensor:'Klima ute',dev:[]},
 {k:'bad2',n:'Bad 2. etasje',s:'Bad oppe',f:2,ic:'bath',zone:'Bad 2. Etasje',dev:[['Termostat bad 2.','gulv','K3_Man_Bad2']]},
 {k:'sov',n:'Hovedsoverom',s:'Soverom',f:2,ic:'bed',zone:'Hovedsoverom',dev:[]},
 {k:'gang2',n:'Gang 2. etasje',s:'Gang oppe',f:2,ic:'hall',zone:'Gang 2. Etasje',dev:[['Termostat Gang 2.','gulv','K3_Man_Gang2']]},
 {k:'sunniva',n:'Sunnivas rom',s:'Sunniva',f:1,ic:'bedk',zone:'Sunniva sitt rom',dev:[]},
 {k:'kontor',n:'Gjesterom / kontor',s:'Kontor',f:1,ic:'desk',zone:'Gjesterom / kontor',dev:[['Panel Heater','ovn','K3_Man_Kontor']]},
 {k:'bad1',n:'Bad 1. etasje',s:'Bad nede',f:1,ic:'bath',zone:'Bad 1. Etasje',dev:[['Termostat bad 1.','gulv','K3_Man_Bad1']]},
 {k:'vask',n:'Vaskerom',s:'Vaskerom',f:1,ic:'wash',zone:'Vaskerom',dev:[['Termostat Vaskerom','gulv','K3_Man_Vaskerom']]},
 {k:'inngang',n:'Inngang',s:'Inngang',f:1,ic:'door',zone:'Inngang',dev:[['Termostat Inngang','gulv','K3_Man_Inngang']]},
 {k:'carport',out:1,n:'Carport',s:'Carport',f:1,ic:'car',zone:'Carport',sensor:'Bevegelses sensor carport',dev:[]},
 {k:'terrasse',out:1,n:'Terrasse',s:'Terrasse',f:1,ic:'umb',zone:'Terrasse',sensor:'Klima ute',dev:[]},
 {k:'kjeller',n:'Kjellerstue',s:'Kjellerstue',f:1,ic:'tv',zone:'Kjellerstue',sensor:'1. Etg Kjellerstue Klima',dev:[['Varmepumpe 1. etg','vp','K3_Man_VP1'],['Termostat Kjellerstue','gulv','K3_Man_Kjeller']]}
];
const DOORS=['Verandadør','Terassedør','Inngangsdør','Dør vaskerom'];
const KIND={vp:'Varmepumpe',gulv:'Gulvvarme',ovn:'Panelovn'};
const BE={set:null,setVar:null,setMood:null,hap(){},refresh:null,sample:true,fixed:null};

const S={dev:{},list:[],vars:{},moods:[],at:null};
const pend={},queue={};let qTimer=null;
const $=id=>document.getElementById(id);
const fmt=v=>v==null||isNaN(v)?'–':(Math.round(v*10)/10).toFixed(1).replace('.',',');
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const clampT=v=>Math.min(30,Math.max(5,Math.round(v*2)/2));
const key=d=>d.id||d.name;
const svgIc=(k,s=22,w=1.8)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><path d="${ICON[k]}"/></svg>`;
const avg=a=>{a=a.filter(v=>v!=null&&!isNaN(v));return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

function setDevices(list){S.list=list||[];S.dev={};for(const d of S.list)S.dev[d.name]=d}
function setVars(arr){S.vars=Object.fromEntries((arr||[]).map(v=>[v.name,{id:v.id,value:v.value}]))}

/* ---------- getters ---------- */
const dev=n=>S.dev[n];
function val(d,cap){if(!d)return null;const p=pend[key(d)];if(p&&cap in p&&Date.now()-p.t<120000)return p[cap];return d.state[cap]}
const target=n=>val(dev(n),'target_temperature');
function roomTemp(r){const s=r.sensor?dev(r.sensor):r.dev[0]&&dev(r.dev[0][0]);return s?s.state.measure_temperature:null}
function roomHum(r){const s=r.sensor&&dev(r.sensor);return s?s.state.measure_humidity:null}
const roomTarget=r=>r.dev[0]?target(r.dev[0][0]):null;
function devHeat(n,k){const d=dev(n);if(!d)return false;const st=d.state;
  if(k==='vp')return !!st.onoff&&st.measure_status==='Heat';
  if(k==='ovn')return !!st.onoff&&(st.measure_power||0)>50;
  return !!st.thermostat_state}
function devState(n,k){const d=dev(n);if(!d)return 'Ikke funnet';if(d.state.onoff===false)return k==='vp'?'Av (pause)':'Av';return devHeat(n,k)?'Varmer':'Hviler'}
const roomHeat=r=>r.dev.some(([n,k])=>devHeat(n,k));
const manVal=v=>Number(S.vars[v]&&S.vars[v].value)||0;
const roomMan=r=>r.dev.some(d=>manVal(d[2])!==0);
const isLight=d=>d.type==='light'||(d.type==='socket'&&/^lys/i.test(d.name));
const allLights=()=>S.list.filter(isLight);

let tt=null;
function toast(t,err){const e=$('toast');e.textContent=t;e.className='toast show'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>e.className='toast',err?5000:2200)}
function put(d,caps){const k=key(d);pend[k]=Object.assign(pend[k]&&Date.now()-pend[k].t<120000?pend[k]:{},caps,{t:Date.now()});if(d.id)queue[d.id]=Object.assign(queue[d.id]||{},caps)}
function go(n,delay){render();if(!BE.set){toast('Eksempeldata – ikke sendt til Homey');return}
  clearTimeout(qTimer);qTimer=setTimeout(flush,delay)}
async function flush(){
  const ids=Object.keys(queue);if(!ids.length)return;
  const state={};for(const id of ids){state[id]=queue[id];delete queue[id]}
  try{await BE.set(state);toast('Lagret');if(BE.refresh)setTimeout(BE.refresh,1500)}
  catch(e){for(const id of ids)delete pend[id];render();toast('Klarte ikke å sende: '+(e&&e.message||e&&e.code||'ukjent feil'),true)}
}

/* ---------- home: wheel ---------- */
const N=ROOMS.length,STEP=360/N;
let th=0;
try{const k=localStorage.getItem('ft-room');const i=ROOMS.findIndex(r=>r.k===k);if(i>=0)th=-i*STEP}catch(e){}
const norm=a=>((a%360)+540)%360-180;
const activeIdx=()=>((Math.round(-th/STEP)%N)+N)%N;
const rad=d=>(d-90)*Math.PI/180;
const pt=(r,d,c=200)=>[c+r*Math.cos(rad(d)),c+r*Math.sin(rad(d))];
function sector(a0,a1,r0,r1){const p=[pt(r1,a0),pt(r1,a1),pt(r0,a1),pt(r0,a0)];return `M${p[0]}A${r1} ${r1} 0 0 1 ${p[1]}L${p[2]}A${r0} ${r0} 0 0 0 ${p[3]}Z`}
function arcPath(r,a0,a1,rev){const p0=pt(r,rev?a1:a0),p1=pt(r,rev?a0:a1);return `M${p0}A${r} ${r} 0 0 ${rev?0:1} ${p1}`}
let TICKS='';for(let i=0;i<180;i++){const a=i*2,[x0,y0]=pt(187,a),[x1,y1]=pt(i%5?195:198,a);TICKS+=`<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}"/>`}
const DEFS=`<defs>
 <linearGradient id="gMetal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef1f4"/><stop offset=".45" stop-color="#8c939d"/><stop offset=".55" stop-color="#cfd3d9"/><stop offset="1" stop-color="#6b727c"/></linearGradient>
 <radialGradient id="gSeg" cx="200" cy="200" r="160" gradientUnits="userSpaceOnUse"><stop offset=".45" stop-color="#151b26"/><stop offset="1" stop-color="#232c3b"/></radialGradient>
 <radialGradient id="gWarm" cx="200" cy="200" r="160" gradientUnits="userSpaceOnUse"><stop offset=".45" stop-color="#5e2a12"/><stop offset="1" stop-color="#e8782e"/></radialGradient>
 <radialGradient id="gGold" cx="200" cy="200" r="160" gradientUnits="userSpaceOnUse"><stop offset=".45" stop-color="#3b3518"/><stop offset="1" stop-color="#c9b45a"/></radialGradient>
 <radialGradient id="gCold" cx="200" cy="200" r="160" gradientUnits="userSpaceOnUse"><stop offset=".45" stop-color="#141f45"/><stop offset="1" stop-color="#2f4fd0"/></radialGradient>
 <radialGradient id="gHub" cx=".5" cy=".35" r=".75"><stop offset="0" stop-color="#1d2533"/><stop offset="1" stop-color="#0c1018"/></radialGradient>
</defs>`;
function drawWheel(){
  const ai=activeIdx();let segs='',labels='',defs='';
  ROOMS.forEach((r,i)=>{
    const a=norm(i*STEP+th),act=i===ai;
    const t=roomTemp(r),tg=roomTarget(r),heat=roomHeat(r),cold=t!=null&&tg!=null&&t<tg-0.7;
    const lit=roomLights(r).filter(lOn).length;
    const fill=heat?'url(#gWarm)':cold?'url(#gCold)':lit?'url(#gGold)':'url(#gSeg)';
    const [cx,cy]=pt(116,a);
    let dots='';for(let j=0;j<Math.min(lit,5);j++){const [x,y]=pt(150-j*8,a+STEP/2-5);dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.8" fill="#ffd36b"/>`}
    if(roomSpeakers(r).some(d=>d.state.speaker_playing)){const [x,y]=pt(150,a-STEP/2+5);dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#b9a2ff"/>`}
    segs+=`<g data-i="${i}"><path d="${sector(a-STEP/2+.5,a+STEP/2-.5,74,158)}" fill="${fill}" stroke="${act?'rgba(255,255,255,.85)':'#0a0d13'}" stroke-width="${act?2:1.5}" ${act?'':'opacity=".92"'}/>
      <path d="${ICON[r.ic]}" transform="translate(${(cx-11).toFixed(1)},${(cy-25).toFixed(1)}) scale(.92)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity="${act?1:.85}"/>
      <text x="${cx.toFixed(1)}" y="${(cy+15).toFixed(1)}" text-anchor="middle" font-size="15" font-weight="800" fill="${heat?'#ffd2b0':'#fff'}">${t==null?'':fmt(t).replace(/,0$/,'')+'°'}</text>${dots}</g>`;
    const rev=Math.abs(a)>90;
    defs+=`<path id="lp${i}" d="${arcPath(171,a-26,a+26,rev)}"/>`;
    if(lit)labels+=`<path d="${arcPath(183,a-STEP/2+2,a+STEP/2-2,false)}" fill="none" stroke="#d98a3a" stroke-width="2.5" stroke-linecap="round"/>`;
    labels+=`<text font-size="${act?15:12.5}" font-weight="${act?900:800}" fill="${act?'#fff':lit?'#e8b07a':'#9aa3b2'}" dominant-baseline="central"><textPath href="#lp${i}" startOffset="50%" text-anchor="middle">${esc(r.s)}</textPath></text>`;
  });
  const r=ROOMS[ai],L=roomLights(r),lit=L.filter(lOn).length,t=roomTemp(r);
  const sub=[L.length?(lit?lit+' lys på':'Lys av'):null,t!=null?fmt(t)+'°':null].filter(Boolean).join(' · ');
  $('wheel').innerHTML=DEFS.replace('</defs>',defs+'</defs>')+`
    <circle cx="200" cy="200" r="192" fill="none" stroke="url(#gMetal)" stroke-width="16"/>
    <g stroke="rgba(30,34,40,.5)" stroke-width=".8">${TICKS}</g>
    <circle cx="200" cy="200" r="171" fill="none" stroke="#0b0f16" stroke-width="26"/>
    ${segs}${labels}
    <path d="M192 41h16l-8 10z" fill="#fff"/>
    <g data-c="1"><circle cx="200" cy="200" r="70" fill="url(#gHub)" stroke="#3a4558" stroke-width="2"/>
      <path d="${arcPath(70,-30,150,false)}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
      <circle cx="200" cy="157" r="15" fill="#263042"/>
      <path d="${ICON[r.ic]}" transform="translate(190,147) scale(.83)" fill="none" stroke="#dfe4ec" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="200" y="194" text-anchor="middle" font-size="${r.s.length>9?19:22}" font-weight="900">${esc(r.s)}</text>
      <text x="200" y="216" text-anchor="middle" font-size="13" font-weight="800" fill="#c9ced8">${esc(sub)}</text>
      <text x="200" y="236" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7f899a">Trykk for å åpne</text></g>`;
  $('wheel').setAttribute('aria-valuetext',r.n);
}
let raf=0;const schedule=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;drawWheel()})};
let anim=null;
function rotateTo(i){
  const goal=th+norm(-i*STEP-th),from=th,t0=performance.now(),dur=reduced?0:260;
  cancelAnimationFrame(anim);
  const stepA=now=>{const p=dur?Math.min(1,(now-t0)/dur):1,e=1-Math.pow(1-p,3);th=from+(goal-from)*e;drawWheel();if(p<1)anim=requestAnimationFrame(stepA);else{th=goal;saveActive()}};
  anim=requestAnimationFrame(stepA);
}
function saveActive(){try{localStorage.setItem('ft-room',ROOMS[activeIdx()].k)}catch(e){}}
{
  const W=$('wheel');let drag=null;
  const sp=e=>{const r=W.getBoundingClientRect();return[(e.clientX-r.left)/r.width*400-200,(e.clientY-r.top)/r.height*400-200]};
  const ang=([x,y])=>Math.atan2(x,-y)*180/Math.PI;
  W.addEventListener('pointerdown',e=>{const p=sp(e),d=Math.hypot(p[0],p[1]);if(d>200)return;cancelAnimationFrame(anim);
    drag={inner:d<70,last:ang(p),moved:0,ai:activeIdx(),hit:e.target.closest?e.target.closest('[data-i]'):null};try{W.setPointerCapture(e.pointerId)}catch(_){}});
  W.addEventListener('pointermove',e=>{if(!drag)return;const p=sp(e);if(Math.hypot(p[0],p[1])<24)return;
    const a=ang(p),d=norm(a-drag.last);drag.last=a;drag.moved+=Math.abs(d);
    if(drag.moved>5){th+=d;const ai=activeIdx();if(ai!==drag.ai){drag.ai=ai;BE.hap()}schedule()}});
  const end=()=>{if(!drag)return;const dd=drag;drag=null;
    if(dd.moved<=5){if(dd.inner){openRoom([ROOMS[activeIdx()]]);return}if(dd.hit){BE.hap();rotateTo(+dd.hit.dataset.i);return}}
    rotateTo(activeIdx())};
  W.addEventListener('pointerup',end);W.addEventListener('pointercancel',end);
  W.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();rotateTo((activeIdx()+1)%N)}
    if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();rotateTo((activeIdx()-1+N)%N)}
    if(e.key==='Enter'||e.key===' '){e.preventDefault();openRoom([ROOMS[activeIdx()]])}});
}

}

  const out=[];

<label>API-nøkkel<input id="suKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Lim inn nøkkelen"></label>
<div class="st" id="suSt"></div>
<div class="row"><button class="btn2" id="suCancel">Avbryt</button><button class="btn2 pri" id="suSave">Koble til</button></div>
<p style="font-size:13px">Nøkkelen lagres bare på denne enheten. Den sendes kun til Homey-adressen over.</p></div>`;
document.body.appendChild(su);
function openSetup(){$('suUrl').value=CFG.url||DEFAULT_URL;$('suKey').value=CFG.key||'';$('suSt').textContent='';$('suCancel').hidden=!CFG.key;su.hidden=false}
$('suCancel').addEventListener('click',()=>{su.hidden=true});
$('suSave').addEventListener('click',async()=>{
  const url=$('suUrl').value.trim(),key=$('suKey').value.trim();if(!/^https:\/\//.test(url)){$('suSt').textContent='Adressen må starte med https://';return}if(!key){$('suSt').textContent='Lim inn API-nøkkelen';return}
  const old=Object.assign({},CFG);Object.assign(CFG,{url,key,via:''});$('suSt').textContent='Kobler til …';$('suSave').disabled=true;
  try{const s=await connect();wire();applyData(s.devices||[],s.vars||[],s.moods||[]);su.hidden=true;toast(CFG.via==='direct'?'Koblet til Homey':'Koblet til via Furutoppen-appen');start()}
  catch(e){Object.assign(CFG,old);$('suSt').textContent='Feilet: '+(e&&e.message||e)+(e instanceof TypeError?' – nettverk, eller Homey sperrer kall fra denne siden (CORS)':'')}
  finally{$('suSave').disabled=false}});
const mi=document.createElement('button');mi.textContent='Homey-tilkobling';mi.addEventListener('click',()=>{$('menu').hidden=true;openSetup()});$('menu').appendChild(mi);
function start(){clearInterval(timer);load();timer=setInterval(()=>{if(document.visibilityState!=='hidden')load()},5000)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load()});
render();
if(CFG.key)start();else openSetup();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

}
</script>
</body>
</html>
